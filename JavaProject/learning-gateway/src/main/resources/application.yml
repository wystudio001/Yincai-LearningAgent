spring:
  main:
    web-application-type: reactive
  application:
    name: learning-gateway
  cloud:
    gateway:
      routes:
        - id: learning-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: learning-user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**
        - id: learning-course-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/courses/**,/api/v1/chapters/**,/api/v1/knowledge-points/**,/api/v1/knowledge-relations/**,/api/v1/course-materials/**
        - id: learning-profile-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/student/profile/**,/api/v1/students/**,/api/v1/profiles/**
        - id: learning-resource-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/resources/**,/api/v1/resource-packages/**,/api/v1/resource-generation-tasks/**,/api/v1/resource-generation-templates/**,/api/v1/files/**
        - id: learning-path-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/student/learning-path/**,/api/v1/learning-paths/**,/api/v1/learning-path-nodes/**
        - id: learning-ai-service
          uri: http://localhost:8087
          predicates:
            - Path=/internal/v1/ai/**
        - id: learning-exam-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/questions/**,/api/v1/exercises/**,/api/v1/assessments/**,/api/v1/student/wrong-questions/**
        - id: learning-notify-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/admin/notification-templates/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600

server:
  port: 8080

yincai:
  security:
    jwt:
      secret: yincai-zhixue-default-secret-key-for-jwt-signing-2026
      access-token-expire-ms: 7200000
      refresh-token-expire-ms: 604800000
