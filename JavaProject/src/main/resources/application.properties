spring.application.name=JavaProject
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/learning_auth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

yincai.security.jwt.secret=yincai-zhixue-default-secret-key-for-jwt-signing-2026
yincai.security.jwt.access-token-expire-ms=7200000
yincai.security.jwt.refresh-token-expire-ms=604800000

logging.level.xyz.wystudio=DEBUG
